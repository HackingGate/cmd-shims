name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shims:
    name: shim behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/run-all.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x lib/*.sh shims/* checks/base/* install.sh tests/*.sh
